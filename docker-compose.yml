services:
  db:
    image: postgres:17-alpine
    container_name: twitter-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: twitter
      POSTGRES_PASSWORD: twitter
      POSTGRES_DB: twitter
    ports:
      - '5434:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U twitter -d twitter']
      interval: 5s
      timeout: 5s
      retries: 10

  db-test:
    image: postgres:17-alpine
    container_name: twitter-db-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: twitter
      POSTGRES_PASSWORD: twitter
      POSTGRES_DB: twitter_test
    ports:
      - '5435:5432'
    # banco de teste é descartável: roda em memória (tmpfs), mais rápido e sempre limpo
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U twitter -d twitter_test']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
